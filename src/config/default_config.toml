# bettertree config
# Run `bt`, press `?` for the list of commands, or type `:` to run one by name

editor = ""                   # empty = $EDITOR, then $VISUAL, then "vi"
jump_lines = 10               # entries moved by jump_down / jump_up
scrolloff = 5                 # keep this many lines of context above/below the cursor
icons = "nerdfont"            # "nerdfont" = file-type glyphs, "unicode" = ▸/▾ only, "none" = +/-
sort_order = "folders_first"  # "folders_first" | "mixed" | "files_first" | "type"
show_diffstat = true          # per-file +n -m on tree rows
max_children = 1000           # entries one folder shows before "… n more entries …"; 0 = no limit
max_expand_all = 20000        # entries one expand_all opens before it gives up; 0 = no limit
indent = 2
watch = true                  # watch the loaded tree for filesystem changes

# Startup defaults, used only for projects that have no saved state yet
[toggles]
show_hidden = false
show_gitignored = false
changed_only = false

# ANSI names, "#rrggbb" for an exact colour, or "reset" for the terminal's foreground/background
[colors]
file = "reset"
file_modified = "yellow"
file_staged = "green"
file_untracked = "green"
file_ignored = "gray"
file_conflicted = "light_red"
dir = "blue"
dir_changed = "yellow"
diff_added = "green"
diff_removed = "red"
ui_selection_bg = "dark_gray"
ui_status_bar_bg = "black"
ui_status_bar_fg = "white"
ui_accent = "blue"
ui_muted_fg = "gray"

# Keys are `C-` and `A-` prefixes plus a character or one of:
# up down left right home end pgup pgdn enter tab S-tab space backspace esc del insert
# Write shifted characters directly, so `G` rather than `S-g`
[keys]

# moving the cursor
"up" = "move_up"
"k" = "move_up"
"C-p" = "move_up"
"down" = "move_down"
"j" = "move_down"
"C-n" = "move_down"
"C-up" = "move_prev_sibling"
"C-k" = "move_prev_sibling"
"C-down" = "move_next_sibling"
"C-j" = "move_next_sibling"
"left" = "move_parent"
"h" = "move_parent"
"pgup" = "jump_up"
"pgdn" = "jump_down"

# acting on the entry under the cursor
"enter" = "select"
"o" = "open"
"e" = "expand_all"
"c" = "collapse_all"

# what's shown in the tree
"." = "toggle_hidden"
"i" = "toggle_gitignored"
"m" = "toggle_changed_only"

# prompts and overlays
":" = "command"
"/" = "search"
"esc" = "dismiss"
"?" = "help"
"q" = "quit"
"C-c" = "quit"
