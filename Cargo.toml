[package]
name = "bettertree"
version = "1.0.0"
edition = "2024"
description = "An interactive terminal file tree driven like Helix"
authors = ["nylyk"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/nylyk/bettertree"
keywords = ["tui", "file-tree", "terminal", "explorer", "git"]
categories = ["command-line-utilities"]
exclude = ["flake.nix", "flake.lock", "CLAUDE.md"]

[[bin]]
name = "bt"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
crossterm = { version = "0.29.0", features = ["osc52"] }
etcetera = "0.11.0"
gix = { version = "0.86.0", default-features = false, features = [
    "status",
    "blob-diff",
    "excludes",
    "revision",
    "max-performance-safe",
    "sha1",
] }
notify = "8.2.0"
nucleo-matcher = "0.3.1"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.3"
